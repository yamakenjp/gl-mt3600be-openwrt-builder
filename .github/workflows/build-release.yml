name: Build and publish Beryl 7 firmware

on:
  push:
    branches:
      - main
    paths:
      - .github/release-trigger
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag for this source-pinned build
        required: true
        default: v25.12-snapshot-20261016.3

permissions:
  contents: read

concurrency:
  group: beryl7-firmware-release
  cancel-in-progress: false

jobs:
  build-firmware:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EXPECTED_RELEASE_TAG: v25.12-snapshot-20261016.3
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v25.12-snapshot-20261016.3' }}

    steps:
      - name: Check out the tagged recipe
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release request
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${RELEASE_TAG}" != "${EXPECTED_RELEASE_TAG}" ]]; then
            printf 'Expected release tag %s, received %s\n' \
              "${EXPECTED_RELEASE_TAG}" "${RELEASE_TAG}" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            trigger_tag="$(tr -d '\r\n' <.github/release-trigger)"
            if [[ "${trigger_tag}" != "${EXPECTED_RELEASE_TAG}" ]]; then
              printf 'Release trigger contains %s, expected %s\n' \
                "${trigger_tag}" "${EXPECTED_RELEASE_TAG}" >&2
              exit 1
            fi
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            printf 'Release %s already exists; refusing to replace it.\n' \
              "${RELEASE_TAG}" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore a completed identical firmware build
        id: output_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: output-repro
          key: >-
            beryl7-output-${{ runner.os }}-${{ hashFiles('build-beryl7-mtk.sh', 'configs/**', 'patches/**', 'files/**') }}

      - name: Restore reusable build caches
        if: steps.output_cache.outputs.cache-hit != 'true'
        id: build_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            .cache/openwrt-downloads
            .cache/ccache
            .cache/go-build
          key: >-
            beryl7-build-${{ runner.os }}-${{ hashFiles('build-beryl7-mtk.sh', 'configs/**', 'patches/**', 'files/**') }}
          restore-keys: |
            beryl7-build-${{ runner.os }}-

      - name: Prepare the clean build host
        if: steps.output_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          # These are large, unrelated SDKs preinstalled on the disposable
          # GitHub runner. Removing only these explicit paths leaves enough
          # room for the OpenWrt toolchain and build tree.
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison build-essential ccache clang file flex gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 \
            python3-pyelftools python3-setuptools rsync squashfs-tools \
            swig unzip wget zlib1g-dev
          df -h .

      - name: Build the firmware
        if: steps.output_cache.outputs.cache-hit != 'true'
        id: build_firmware
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p \
            "${GITHUB_WORKSPACE}/.cache/openwrt-downloads" \
            "${GITHUB_WORKSPACE}/.cache/ccache" \
            "${GITHUB_WORKSPACE}/.cache/go-build"
          CCACHE_DIR="${GITHUB_WORKSPACE}/.cache/ccache" \
            ccache --max-size=2G
          JOBS=2 DOWNLOAD_JOBS=4 AUTOREMOVE=1 \
            DOWNLOAD_CACHE_DIR="${GITHUB_WORKSPACE}/.cache/openwrt-downloads" \
            COMPILER_CACHE_DIR="${GITHUB_WORKSPACE}/.cache/ccache" \
            GOLANG_BUILD_CACHE_DIR="${GITHUB_WORKSPACE}/.cache/go-build" \
            bash ./build-beryl7-mtk.sh

      - name: Save reusable build caches
        if: >-
          ${{ always() && steps.build_firmware.outcome == 'success' && steps.build_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            .cache/openwrt-downloads
            .cache/ccache
            .cache/go-build
          key: ${{ steps.build_cache.outputs.cache-primary-key }}

      - name: Save partial caches after a failed build
        if: >-
          ${{ always() && steps.build_firmware.outcome == 'failure' && steps.build_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            .cache/openwrt-downloads
            .cache/ccache
            .cache/go-build
          key: >-
            ${{ steps.build_cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the completed firmware for verification retries
        if: >-
          ${{ steps.output_cache.outputs.cache-hit != 'true' && steps.build_firmware.outcome == 'success' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: output-repro
          key: ${{ steps.output_cache.outputs.cache-primary-key }}

      - name: Preserve the completed build for verification
        uses: actions/upload-artifact@v7
        with:
          name: beryl7-output-${{ github.run_id }}
          path: output-repro/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  verify-release:
    if: github.ref == 'refs/heads/main'
    needs: build-firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'v25.12-snapshot-20261016.3' }}
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the tagged recipe
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore the completed firmware
        id: output_cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: output-repro
          key: >-
            beryl7-output-${{ runner.os }}-${{ hashFiles('build-beryl7-mtk.sh', 'configs/**', 'patches/**', 'files/**') }}

      - name: Download the completed firmware
        if: steps.output_cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v8
        with:
          name: beryl7-output-${{ github.run_id }}
          path: output-repro

      - name: Prepare the verification host
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            device-tree-compiler squashfs-tools

      - name: Verify release contents
        shell: bash
        run: |
          set -Eeuo pipefail
          cd output-repro
          sha256sum --check SHA256SUMS

          mapfile -t sysupgrade_images < <(
            find . -maxdepth 1 -type f \
              -name '*glinet_gl-mt3600be*squashfs-sysupgrade.bin' -print
          )
          mapfile -t initramfs_images < <(
            find . -maxdepth 1 -type f \
              -name '*glinet_gl-mt3600be*initramfs-kernel.bin' -print
          )
          [[ ${#sysupgrade_images[@]} -eq 1 ]]
          [[ ${#initramfs_images[@]} -eq 1 ]]

          grep -Fqx \
            'CONFIG_VERSION_CODE="r0+32742-7e35c47c00-beryl7.3"' \
            openwrt.config
          for package in \
              tailscale kmod-tun kmod-wireguard wireguard-tools \
              luci-proto-wireguard kmod-veth kmod-sched-cake \
              sqm-scripts luci-app-sqm \
              kmod-crypto-eip kmod-crypto-hw-safexcel \
              kmod-nf-flow kmod-nf-flow-netlink kmod-nft-offload \
              netfilter-flowtable mtkhnat_util \
              kmod-ipsec4 kmod-ipsec6 kmod-xfrm-interface \
              kmod-usb-net-rndis kmod-usb-net-cdc-mbim \
              kmod-usb-net-qmi-wwan kmod-usb-net-ipheth \
              usbmuxd libimobiledevice-utils \
              kmod-fs-exfat kmod-fs-ntfs3 kmod-usb-storage-uas block-mount \
              luci-i18n-base-ja luci-i18n-firewall-ja \
              luci-i18n-package-manager-ja; do
            if ! grep -Fqx "CONFIG_PACKAGE_${package}=y" openwrt.config; then
              printf 'Required package is missing from openwrt.config: %s\n' \
                "${package}" >&2
              exit 1
            fi
          done

          manifest="$(find . -maxdepth 1 -type f -name '*.manifest' -print -quit)"
          [[ -n "${manifest}" ]]
          grep -Eq '^tailscale - 1\.102\.3([.-]|$)' "${manifest}"
          grep -Eq '^kmod-tun - ' "${manifest}"

          root_entry="$({
            tar -tf "${sysupgrade_images[0]}" | \
              awk '/\/root$/ { print; exit }'
          })"
          [[ -n "${root_entry}" ]]
          root_image="${RUNNER_TEMP}/beryl7-root.squashfs"
          rootfs_dir="${RUNNER_TEMP}/beryl7-rootfs"
          tar -xOf "${sysupgrade_images[0]}" "${root_entry}" >"${root_image}"
          # The SquashFS contains /dev/console.  Root privileges are required
          # to recreate that device node even though the following checks are
          # read-only.
          sudo unsquashfs -no-progress -d "${rootfs_dir}" \
            "${root_image}" >/dev/null

          test -x "${rootfs_dir}/usr/sbin/tailscaled"
          test -x \
            "${rootfs_dir}/etc/uci-defaults/98-beryl7-usb-automount"
          grep -Fqx \
            "uci -q set 'fstab.@global[0].anon_mount=1' || exit 1" \
            "${rootfs_dir}/etc/uci-defaults/98-beryl7-usb-automount"
          grep -Fqx \
            "uci -q set 'fstab.@global[0].auto_mount=1' || exit 1" \
            "${rootfs_dir}/etc/uci-defaults/98-beryl7-usb-automount"
          test -x "${rootfs_dir}/etc/uci-defaults/99-beryl7-luci-ja"
          grep -Fqx "uci -q set luci.main.lang='ja'" \
            "${rootfs_dir}/etc/uci-defaults/99-beryl7-luci-ja"
          if grep -Eq '^[[:space:]]*[^#].*mtk_openwrt_feed' \
              "${rootfs_dir}/etc/apk/repositories.d/distfeeds.list"; then
            echo 'The build-only MediaTek feed is active in the image.' >&2
            exit 1
          fi
          for automount_option in anon_mount auto_mount; do
            if ! grep -Eq \
                "^[[:space:]]*option[[:space:]]+${automount_option}[[:space:]]+'1'[[:space:]]*$" \
                "${rootfs_dir}/etc/config/fstab"; then
              printf 'USB automount option is not enabled: %s\n' \
                "${automount_option}" >&2
              exit 1
            fi
          done
          for module in \
              tun.ko wireguard.ko sch_cake.ko xfrm_interface.ko \
              ipheth.ko ntfs3.ko exfat.ko usb-storage.ko uas.ko; do
            if ! find "${rootfs_dir}/lib/modules" -type f -name "${module}" \
                -print -quit | grep -q .; then
              printf 'Required kernel module is missing from rootfs: %s\n' \
                "${module}" >&2
              exit 1
            fi
          done

          board_dtb="${RUNNER_TEMP}/beryl7-board.dtb"
          fdtget -t bx "${initramfs_images[0]}" /images/fdt-1 data | \
            python3 -c \
              'import sys; sys.stdout.buffer.write(bytes(int(x, 16) for x in sys.stdin.read().split()))' \
              >"${board_dtb}"
          test "$(fdtget -t x "${board_dtb}" \
            /soc/usb@11200000 mediatek,u3p-dis-msk)" = "0"
          read -r -a usb_phys <<<"$(fdtget -t x "${board_dtb}" \
            /soc/usb@11200000 phys)"
          [[ ${#usb_phys[@]} -eq 4 ]]
          [[ "${usb_phys[1]}" == "3" ]]
          [[ "${usb_phys[3]}" == "4" ]]

      - name: Publish the immutable pre-release
        shell: bash
        run: |
          set -Eeuo pipefail
          sysupgrade_image="$(find output-repro -maxdepth 1 -type f \
            -name '*glinet_gl-mt3600be*squashfs-sysupgrade.bin' \
            -print -quit)"
          [[ -n "${sysupgrade_image}" ]]
          release_notes="${RUNNER_TEMP}/beryl7-release-notes.md"
          cp RELEASE-NOTES.md "${release_notes}"
          {
            printf '\n## CIで検証した通常更新用イメージ\n\n'
            printf -- '- ファイル: `%s`\n' "$(basename "${sysupgrade_image}")"
            printf -- '- サイズ: `%s bytes`\n' "$(stat -c '%s' "${sysupgrade_image}")"
            printf -- '- SHA-256: `%s`\n' \
              "$(sha256sum "${sysupgrade_image}" | awk '{print $1}')"
            printf -- '- Actions run: `%s`\n' "${GITHUB_RUN_ID}"
          } >>"${release_notes}"
          gh release create "${RELEASE_TAG}" output-repro/* \
            --target "${GITHUB_SHA}" \
            --title "Beryl 7 OpenWrt 25.12 + MediaTek (${RELEASE_TAG})" \
            --notes-file "${release_notes}" \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
